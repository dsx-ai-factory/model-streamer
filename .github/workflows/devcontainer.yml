name: Build devcontainer

on:
  workflow_call:
    inputs:
      arch:
        description: Native build architecture (x86_64 or aarch64).
        type: string
        default: x86_64
      publish:
        description: Push to GHCR; otherwise export the image as a workflow artifact.
        type: boolean
        default: false
    outputs:
      image:
        description: Fully qualified image tag to run.
        value: ${{ jobs.build.outputs.image }}
      artifact:
        description: Image artifact name when publish is false.
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    name: Build devcontainer image
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      artifact: ${{ steps.image.outputs.artifact }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Select image tag
      id: image
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        ARCH: ${{ inputs.arch }}
      run: |
        repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        image_name="ghcr.io/${repository}/devcontainer"
        tag=latest-${ARCH}
        artifact=
        if [[ "$PUBLISH" != true ]]; then
          tag="pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          artifact="devcontainer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
        fi
        printf 'name=%s\ntag=%s\nimage=%s:%s\nartifact=%s\n' \
          "$image_name" "$tag" "$image_name" "$tag" "$artifact" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build devcontainer
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
      with:
        imageName: ${{ steps.image.outputs.name }}
        imageTag: ${{ steps.image.outputs.tag }}
        cacheFrom: ${{ steps.image.outputs.name }}:latest-${{ inputs.arch }}
        push: ${{ inputs.publish && 'always' || 'never' }}

    - name: Export devcontainer image
      if: ${{ !inputs.publish }}
      env:
        CI_IMAGE: ${{ steps.image.outputs.image }}
      run: docker save --output "$RUNNER_TEMP/devcontainer.tar" "$CI_IMAGE"

    - name: Upload devcontainer image
      if: ${{ !inputs.publish }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.image.outputs.artifact }}
        path: ${{ runner.temp }}/devcontainer.tar
        if-no-files-found: error
        compression-level: 1
        retention-days: 1
