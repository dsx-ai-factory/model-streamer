name: RunAI Model Streamer Library - Pull Request
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.version.outputs.PACKAGE_VERSION }}
      devcontainer_changed: ${{ steps.devcontainer_changes.outputs.any_modified }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Detect devcontainer changes
      id: devcontainer_changes
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      with:
        files: |
          .devcontainer/**
          .github/workflows/devcontainer.yml
        skip_initial_fetch: true
        output_renamed_files_as_deleted_and_added: true

    - name: Set PACKAGE_VERSION
      id: version
      run: |
        set -euo pipefail
        if [[ ! "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::GITHUB_SHA must be a full 40-character commit SHA" >&2
          exit 1
        fi
        printf 'PACKAGE_VERSION=0.0.0+dev.%s\n' "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  devcontainer_x86:
    name: Prepare x86_64 devcontainer
    needs: setup
    if: needs.setup.outputs.devcontainer_changed == 'true'
    uses: ./.github/workflows/devcontainer.yml
    with:
      publish: false
      arch: x86_64

  devcontainer_arm:
    name: Prepare aarch64 devcontainer
    needs: setup
    if: needs.setup.outputs.devcontainer_changed == 'true'
    uses: ./.github/workflows/devcontainer.yml
    with:
      publish: false
      arch: aarch64

  build_x86:
    name: Build & tests (${{ matrix.component }}, x86_64)
    needs: [setup, devcontainer_x86]
    # The optional image job is skipped when the published image can be reused.
    if: >-
      ${{ !cancelled() && needs.setup.result == 'success' &&
          (needs.setup.outputs.devcontainer_changed != 'true' || needs.devcontainer_x86.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        component: [streamer, s3, gcs, azure]
    uses: ./.github/workflows/build.yml
    with:
      arch: x86_64
      component: ${{ matrix.component }}
      package_version: ${{ needs.setup.outputs.package_version }}
      devcontainer_image: ${{ needs.devcontainer_x86.outputs.image || format('ghcr.io/{0}/devcontainer:latest-x86_64', github.repository) }}
      devcontainer_artifact: ${{ needs.devcontainer_x86.outputs.artifact }}

  build_arm:
    name: Build (${{ matrix.component }}, aarch64)
    needs: [setup, devcontainer_arm]
    # The optional image job is skipped when the published image can be reused.
    if: >-
      ${{ !cancelled() && needs.setup.result == 'success' &&
          (needs.setup.outputs.devcontainer_changed != 'true' || needs.devcontainer_arm.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        component: [streamer, s3, gcs, azure]
    uses: ./.github/workflows/build.yml
    with:
      arch: aarch64
      component: ${{ matrix.component }}
      package_version: ${{ needs.setup.outputs.package_version }}
      devcontainer_image: ${{ needs.devcontainer_arm.outputs.image || format('ghcr.io/{0}/devcontainer:latest-aarch64', github.repository) }}
      devcontainer_artifact: ${{ needs.devcontainer_arm.outputs.artifact }}

  tests:
    name: Integration & strategies
    needs: [setup, devcontainer_x86, devcontainer_arm, build_x86, build_arm]
    if: ${{ !cancelled() && needs.build_x86.result == 'success' && needs.build_arm.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
      CI_IMAGE: ${{ (matrix.arch == 'aarch64' && needs.devcontainer_arm.outputs.image || needs.devcontainer_x86.outputs.image) || format('ghcr.io/{0}/devcontainer:latest-{1}', github.repository, matrix.arch) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Log in to GitHub Container Registry
      if: needs.setup.outputs.devcontainer_changed != 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download PR devcontainer
      if: needs.setup.outputs.devcontainer_changed == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ matrix.arch == 'aarch64' && needs.devcontainer_arm.outputs.artifact || needs.devcontainer_x86.outputs.artifact }}
        path: ${{ runner.temp }}/devcontainer

    - name: Load PR devcontainer
      if: needs.setup.outputs.devcontainer_changed == 'true'
      run: docker load --input "$RUNNER_TEMP/devcontainer/devcontainer.tar"

    - name: Configure selected devcontainer
      run: |
        jq --null-input --arg image "$CI_IMAGE" \
          '{image: $image, runArgs: ["--security-opt", "seccomp=unconfined"]}' \
          > "$RUNNER_TEMP/devcontainer.json"

    - name: Download native packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: packages-*-${{ matrix.arch }}
        path: py
        merge-multiple: true

    - name: Run integration tests and filesystem strategies
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
      env:
        # The daemon-backed builder can see images imported with docker load.
        BUILDX_BUILDER: default
      with:
        configFile: ${{ runner.temp }}/devcontainer.json
        push: never
        env: |
          PACKAGE_VERSION
        runCmd: make ci-test-integration BAZEL_TEST_FLAGS=--test_env=RUNAI_STREAMER_REQUIRE_IO_URING=1

  lifecycle-install-tests:
    name: Test, Build & Push
    if: always()
    needs: [build_x86, build_arm, tests]
    runs-on: ubuntu-24.04
    steps:
    - name: Require all builds and tests to succeed
      env:
        X86_RESULT: ${{ needs.build_x86.result }}
        ARM_RESULT: ${{ needs.build_arm.result }}
        TEST_RESULT: ${{ needs.tests.result }}
      run: |
        test "$X86_RESULT" = success
        test "$ARM_RESULT" = success
        test "$TEST_RESULT" = success
