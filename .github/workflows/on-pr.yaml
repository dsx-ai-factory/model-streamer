name: RunAI Model Streamer Library - Pull Request
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lifecycle-install-tests:
    name: Test, Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      # Published by build-devcontainer.yml, including the devcontainer Features.
      image: ghcr.io/${{ github.repository }}/devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Keep io_uring available, matching .devcontainer/devcontainer.json.
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set PACKAGE_VERSION
      run: |
        set -euo pipefail
        if [[ ! "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::GITHUB_SHA must be a full 40-character commit SHA" >&2
          exit 1
        fi
        printf 'PACKAGE_VERSION=0.0.0+dev.%s\n' "${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

    - name: Run tests
      run: make test BAZEL_TEST_FLAGS=--test_env=RUNAI_STREAMER_REQUIRE_IO_URING=1

    - name: Build packages
      run: make build

    - name: Upload streamer package to github action
      uses: actions/upload-artifact@v4
      with:
        name: runai_model_streamer
        path: py/runai_model_streamer/dist/*
        if-no-files-found: error

    - name: Upload s3 streamer package to github action
      uses: actions/upload-artifact@v4
      with:
        name: runai_model_streamer_s3
        path: py/runai_model_streamer_s3/dist/*
        if-no-files-found: error

    - name: Upload GCS streamer package to github action
      uses: actions/upload-artifact@v4
      with:
        name: runai_model_streamer_gcs
        path: py/runai_model_streamer_gcs/dist/*
        if-no-files-found: error

    - name: Upload Azure streamer package to github action
      uses: actions/upload-artifact@v4
      with:
        name: runai_model_streamer_azure
        path: py/runai_model_streamer_azure/dist/*
        if-no-files-found: error
