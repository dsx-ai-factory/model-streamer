name: RunAI Model Streamer Library - Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.version.outputs.PACKAGE_VERSION }}
      framework_install_changed: ${{ steps.framework_install_changes.outputs.any_modified }}
      devcontainer_changed: ${{ steps.devcontainer_changes.outputs.any_modified }}
      baseline_tag: ${{ steps.image.outputs.baseline_tag }}
      baseline_image: ${{ steps.published_image.outputs.image }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Detect framework installation changes
      id: framework_install_changes
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      with:
        files: |
          py/**/setup.py
          py/**/pyproject.toml
          py/**/Makefile
          py/**/requirements*
          cpp/WORKSPACE
          cpp/MODULE.bazel*
          cpp/.bazelversion
          cpp/.bazelrc
          cpp/**/*.bzl
          .devcontainer/**
          Makefile
          requirements*.txt
          .github/workflows/**
          .github/scripts/**
        skip_initial_fetch: true
        output_renamed_files_as_deleted_and_added: true

    - name: Detect devcontainer changes
      id: devcontainer_changes
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      with:
        files: |
          .devcontainer/**
          .github/workflows/devcontainer.yml
          .github/workflows/build-devcontainer.yml
          .github/workflows/publish-devcontainer.yml
          .github/workflows/on-pr.yaml
        skip_initial_fetch: true
        output_renamed_files_as_deleted_and_added: true

    - name: Select target branch devcontainer
      id: image
      env:
        BASE_BRANCH: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        tag=latest
        if [[ "$BASE_BRANCH" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
          tag="release-${BASE_BRANCH#release/}"
        fi
        repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        printf 'baseline_tag=%s\nbaseline_image=ghcr.io/%s/devcontainer:%s\n' \
          "$tag" "$repository" "$tag" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      if: steps.devcontainer_changes.outputs.any_modified != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Resolve published multi-architecture devcontainer
      id: published_image
      if: steps.devcontainer_changes.outputs.any_modified != 'true'
      env:
        BASELINE_IMAGE: ${{ steps.image.outputs.baseline_image }}
        BASE_BRANCH: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        image="$BASELINE_IMAGE"
        if ! manifest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}') ||
           ! digest=$(jq -er '
             select(.mediaType == "application/vnd.oci.image.index.v1+json" or
                    .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
             | select([.manifests[] | select(.platform.os == "linux") | .platform.architecture]
                      | index("amd64") != null and index("arm64") != null)
             | .digest | strings | select(length == 71 and test("^sha256:[0-9a-f]{64}$"))
           ' <<< "$manifest"); then
          echo "::error::Cannot use devcontainer $image. Require both linux/amd64 and linux/arm64 and a valid index digest. Run Build and Push DevContainer on the matching branch before retrying." >&2
          printf 'gh workflow run build-devcontainer.yml --repo %q --ref %q\n' \
            "$GITHUB_REPOSITORY" "$BASE_BRANCH"
          exit 1
        fi
        resolved="${image%:*}@$digest"
        printf 'image=%s\n' "$resolved" >> "$GITHUB_OUTPUT"

    - name: Test PR version selection
      run: python3 -B -m unittest discover -s .github/scripts -p test_pr_version.py -v

    - name: Set PACKAGE_VERSION
      id: version
      env:
        BASE_BRANCH: ${{ github.base_ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python3 .github/scripts/pr_version.py \
          --base-branch "$BASE_BRANCH" --base-sha "$BASE_SHA" \
          --commit "$GITHUB_SHA" --pr-number "$PR_NUMBER" >> "$GITHUB_OUTPUT"

  devcontainer_amd64:
    name: Prepare AMD64 devcontainer
    needs: setup
    if: needs.setup.outputs.devcontainer_changed == 'true'
    uses: ./.github/workflows/devcontainer.yml
    with:
      architecture: amd64
      publish: false
      baseline_tag: ${{ needs.setup.outputs.baseline_tag }}

  devcontainer_arm64:
    name: Prepare ARM64 devcontainer
    needs: setup
    if: needs.setup.outputs.devcontainer_changed == 'true'
    uses: ./.github/workflows/devcontainer.yml
    with:
      architecture: arm64
      publish: false
      baseline_tag: ${{ needs.setup.outputs.baseline_tag }}

  build_x86:
    name: Build & tests (${{ matrix.component }}, x86_64)
    needs: [setup, devcontainer_amd64]
    # The optional image job is skipped when the published image can be reused.
    if: >-
      ${{ !cancelled() && needs.setup.result == 'success' &&
          (needs.setup.outputs.devcontainer_changed != 'true' || needs.devcontainer_amd64.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        component: [streamer, s3, gcs, azure]
    uses: ./.github/workflows/build.yml
    with:
      arch: x86_64
      artifact_retention_days: 7
      component: ${{ matrix.component }}
      package_version: ${{ needs.setup.outputs.package_version }}
      devcontainer_image: ${{ needs.devcontainer_amd64.outputs.image || needs.setup.outputs.baseline_image }}
      devcontainer_artifact: ${{ needs.devcontainer_amd64.outputs.artifact }}

  build_arm:
    name: Build & tests (${{ matrix.component }}, aarch64)
    needs: [setup, devcontainer_arm64]
    # The optional image job is skipped when the published image can be reused.
    if: >-
      ${{ !cancelled() && needs.setup.result == 'success' &&
          (needs.setup.outputs.devcontainer_changed != 'true' || needs.devcontainer_arm64.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        component: [streamer, s3, gcs, azure]
    uses: ./.github/workflows/build.yml
    with:
      arch: aarch64
      artifact_retention_days: 7
      component: ${{ matrix.component }}
      package_version: ${{ needs.setup.outputs.package_version }}
      devcontainer_image: ${{ needs.devcontainer_arm64.outputs.image || needs.setup.outputs.baseline_image }}
      devcontainer_artifact: ${{ needs.devcontainer_arm64.outputs.artifact }}

  tests:
    name: Integration & strategies (${{ matrix.arch }})
    needs: [setup, devcontainer_amd64, devcontainer_arm64, build_x86, build_arm]
    if: ${{ !cancelled() && needs.build_x86.result == 'success' && needs.build_arm.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
      CI_IMAGE: ${{ (matrix.arch == 'aarch64' && needs.devcontainer_arm64.outputs.image || needs.devcontainer_amd64.outputs.image) || needs.setup.outputs.baseline_image }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Log in to GitHub Container Registry
      if: needs.setup.outputs.devcontainer_changed != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download PR devcontainer
      if: needs.setup.outputs.devcontainer_changed == 'true'
      uses: actions/download-artifact@v7
      with:
        name: ${{ matrix.arch == 'aarch64' && needs.devcontainer_arm64.outputs.artifact || needs.devcontainer_amd64.outputs.artifact }}
        path: ${{ runner.temp }}/devcontainer

    - name: Load PR devcontainer
      if: needs.setup.outputs.devcontainer_changed == 'true'
      run: docker load --input "$RUNNER_TEMP/devcontainer/devcontainer.tar"

    - name: Configure selected devcontainer
      run: |
        jq --null-input --arg image "$CI_IMAGE" \
          '{image: $image, runArgs: ["--security-opt", "seccomp=unconfined"]}' \
          > "$RUNNER_TEMP/devcontainer.json"

    - name: Download native packages
      uses: actions/download-artifact@v7
      with:
        pattern: ci-packages-*-${{ matrix.arch }}
        path: py
        merge-multiple: true

    - name: Run integration tests and filesystem strategies
      uses: devcontainers/ci@v0.3
      env:
        # The daemon-backed builder can see images imported with docker load.
        BUILDX_BUILDER: default
      with:
        configFile: ${{ runner.temp }}/devcontainer.json
        push: never
        env: |
          PACKAGE_VERSION
        runCmd: make ci-test-integration BAZEL_TEST_FLAGS=--test_env=RUNAI_STREAMER_REQUIRE_IO_URING=1

  packages:
    name: Assemble packages
    needs: [setup, build_x86, build_arm]
    if: ${{ !cancelled() && needs.build_x86.result == 'success' && needs.build_arm.result == 'success' }}
    uses: ./.github/workflows/assemble-bundle.yml
    with:
      package_version: ${{ needs.setup.outputs.package_version }}
      artifact_name: release-bundle-pr-${{ github.run_id }}-${{ github.run_attempt }}
      retention_days: 7
      allow_development_version: true

  framework-install:
    name: Framework dependency installation
    needs: [setup, build_x86]
    if: >-
      ${{ !cancelled() && needs.setup.result == 'success' &&
          needs.build_x86.result == 'success' &&
          needs.setup.outputs.framework_install_changed == 'true' }}
    uses: ./.github/workflows/framework-install.yml
    with:
      package_version: ${{ needs.setup.outputs.package_version }}

  lifecycle-install-tests:
    name: Test, Build & Push
    if: always()
    needs: [setup, devcontainer_amd64, devcontainer_arm64, build_x86, build_arm, tests, packages, framework-install]
    runs-on: ubuntu-24.04
    steps:
    - name: Require all builds, tests, and package uploads to succeed
      env:
        X86_RESULT: ${{ needs.build_x86.result }}
        ARM_RESULT: ${{ needs.build_arm.result }}
        TEST_RESULT: ${{ needs.tests.result }}
        PACKAGES_RESULT: ${{ needs.packages.result }}
        FRAMEWORK_INSTALL_CHANGED: ${{ needs.setup.outputs.framework_install_changed }}
        FRAMEWORK_INSTALL_RESULT: ${{ needs.framework-install.result }}
        DEVCONTAINER_CHANGED: ${{ needs.setup.outputs.devcontainer_changed }}
        AMD64_IMAGE_RESULT: ${{ needs.devcontainer_amd64.result }}
        ARM64_IMAGE_RESULT: ${{ needs.devcontainer_arm64.result }}
      run: |
        test "$X86_RESULT" = success
        test "$ARM_RESULT" = success
        test "$TEST_RESULT" = success
        test "$PACKAGES_RESULT" = success
        if [[ "$FRAMEWORK_INSTALL_CHANGED" == true ]]; then
          test "$FRAMEWORK_INSTALL_RESULT" = success
        else
          test "$FRAMEWORK_INSTALL_RESULT" = skipped
        fi
        if [[ "$DEVCONTAINER_CHANGED" == true ]]; then
          test "$AMD64_IMAGE_RESULT" = success
          test "$ARM64_IMAGE_RESULT" = success
        else
          test "$AMD64_IMAGE_RESULT" = skipped
          test "$ARM64_IMAGE_RESULT" = skipped
        fi
