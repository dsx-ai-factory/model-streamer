name: RunAI Model Streamer Library - Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.PACKAGE_VERSION }}
      devcontainer_changed: ${{ steps.devcontainer_changes.outputs.any_modified }}
      baseline_tag: ${{ steps.image.outputs.baseline_tag }}
      baseline_image: ${{ steps.image.outputs.baseline_image }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Detect devcontainer changes
      id: devcontainer_changes
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      with:
        files: |
          .devcontainer/**
          cpp/.bazelversion
          cpp/.bazelrc
          cpp/toolchain/**
          cpp/third_party/gcp_repo.bzl
          cpp/third_party/BUILD
          .github/workflows/devcontainer.yml
          .github/workflows/build-devcontainer.yml
        skip_initial_fetch: true
        output_renamed_files_as_deleted_and_added: true

    - name: Select target branch devcontainer
      id: image
      env:
        BASE_BRANCH: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        tag=latest
        if [[ "$BASE_BRANCH" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
          tag="release-${BASE_BRANCH#release/}"
        fi
        repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        printf 'baseline_tag=%s\nbaseline_image=ghcr.io/%s/devcontainer:%s\n' \
          "$tag" "$repository" "$tag" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      if: steps.devcontainer_changes.outputs.any_modified != 'true' && steps.image.outputs.baseline_tag != 'latest'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Require published release devcontainer
      if: steps.devcontainer_changes.outputs.any_modified != 'true' && steps.image.outputs.baseline_tag != 'latest'
      env:
        BASELINE_IMAGE: ${{ steps.image.outputs.baseline_image }}
        BASE_BRANCH: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if ! docker manifest inspect "$BASELINE_IMAGE" > /dev/null; then
          echo "::error::Cannot access release devcontainer $BASELINE_IMAGE. Check registry access and the branch's Build and Push DevContainer run. If the image is missing, initialize it with the command below, wait for publication, then rerun this PR workflow."
          printf 'gh workflow run build-devcontainer.yml --repo %q --ref %q\n' \
            "$GITHUB_REPOSITORY" "$BASE_BRANCH"
          exit 1
        fi

    - name: Set PACKAGE_VERSION
      id: version
      run: |
        set -euo pipefail
        if [[ ! "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::GITHUB_SHA must be a full 40-character commit SHA" >&2
          exit 1
        fi
        printf 'PACKAGE_VERSION=0.0.0+dev.%s\n' "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  devcontainer:
    name: Prepare devcontainer
    needs: setup
    if: needs.setup.outputs.devcontainer_changed == 'true'
    uses: ./.github/workflows/devcontainer.yml
    with:
      publish: false
      baseline_tag: ${{ needs.setup.outputs.baseline_tag }}

  build_x86:
    name: Build & tests (${{ matrix.component }}, x86_64)
    needs: [setup, devcontainer]
    # The optional image job is skipped when the published image can be reused.
    if: >-
      ${{ !cancelled() && needs.setup.result == 'success' &&
          (needs.setup.outputs.devcontainer_changed != 'true' || needs.devcontainer.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        component: [streamer, s3, gcs, azure]
    uses: ./.github/workflows/build.yml
    with:
      arch: x86_64
      artifact_retention_days: 7
      component: ${{ matrix.component }}
      package_version: ${{ needs.setup.outputs.package_version }}
      devcontainer_image: ${{ needs.devcontainer.outputs.image || needs.setup.outputs.baseline_image }}
      devcontainer_artifact: ${{ needs.devcontainer.outputs.artifact }}

  build_arm:
    name: Build (${{ matrix.component }}, aarch64)
    needs: [setup, devcontainer]
    # The optional image job is skipped when the published image can be reused.
    if: >-
      ${{ !cancelled() && needs.setup.result == 'success' &&
          (needs.setup.outputs.devcontainer_changed != 'true' || needs.devcontainer.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        component: [streamer, s3, gcs, azure]
    uses: ./.github/workflows/build.yml
    with:
      arch: aarch64
      artifact_retention_days: 7
      component: ${{ matrix.component }}
      package_version: ${{ needs.setup.outputs.package_version }}
      devcontainer_image: ${{ needs.devcontainer.outputs.image || needs.setup.outputs.baseline_image }}
      devcontainer_artifact: ${{ needs.devcontainer.outputs.artifact }}

  tests:
    name: Integration & strategies
    needs: [setup, devcontainer, build_x86]
    if: ${{ !cancelled() && needs.build_x86.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
      CI_IMAGE: ${{ needs.devcontainer.outputs.image || needs.setup.outputs.baseline_image }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Log in to GitHub Container Registry
      if: needs.setup.outputs.devcontainer_changed != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download PR devcontainer
      if: needs.setup.outputs.devcontainer_changed == 'true'
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.devcontainer.outputs.artifact }}
        path: ${{ runner.temp }}/devcontainer

    - name: Load PR devcontainer
      if: needs.setup.outputs.devcontainer_changed == 'true'
      run: docker load --input "$RUNNER_TEMP/devcontainer/devcontainer.tar"

    - name: Configure selected devcontainer
      run: |
        jq --null-input --arg image "$CI_IMAGE" \
          '{image: $image, runArgs: ["--security-opt", "seccomp=unconfined"]}' \
          > "$RUNNER_TEMP/devcontainer.json"

    - name: Download native packages
      uses: actions/download-artifact@v7
      with:
        pattern: ci-packages-*-x86_64
        path: py
        merge-multiple: true

    - name: Run integration tests and filesystem strategies
      uses: devcontainers/ci@v0.3
      env:
        # The daemon-backed builder can see images imported with docker load.
        BUILDX_BUILDER: default
      with:
        configFile: ${{ runner.temp }}/devcontainer.json
        push: never
        env: |
          PACKAGE_VERSION
        runCmd: make ci-test-integration BAZEL_TEST_FLAGS=--test_env=RUNAI_STREAMER_REQUIRE_IO_URING=1

  packages:
    name: Assemble packages
    needs: [setup, build_x86, build_arm]
    if: ${{ !cancelled() && needs.build_x86.result == 'success' && needs.build_arm.result == 'success' }}
    uses: ./.github/workflows/assemble-bundle.yml
    with:
      package_version: ${{ needs.setup.outputs.package_version }}
      artifact_name: release-bundle-pr-${{ github.run_id }}-${{ github.run_attempt }}
      retention_days: 7
      allow_development_version: true

  lifecycle-install-tests:
    name: Test, Build & Push
    if: always()
    needs: [build_x86, build_arm, tests, packages]
    runs-on: ubuntu-latest
    steps:
    - name: Require all builds, tests, and package uploads to succeed
      env:
        X86_RESULT: ${{ needs.build_x86.result }}
        ARM_RESULT: ${{ needs.build_arm.result }}
        TEST_RESULT: ${{ needs.tests.result }}
        PACKAGES_RESULT: ${{ needs.packages.result }}
      run: |
        test "$X86_RESULT" = success
        test "$ARM_RESULT" = success
        test "$TEST_RESULT" = success
        test "$PACKAGES_RESULT" = success
