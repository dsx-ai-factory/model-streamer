name: Nightly GPU tests

on:
  # TEMPORARY: runs this workflow on a push to its development branch, before the file exists on the default
  # branch, where workflow_dispatch cannot see it yet. (A pull_request trigger does not work: the NVIDIA
  # runners refuse pull_request events.) Remove before merging.
  push:
    branches:
      - real-gpu-tests
    paths:
      - '.github/workflows/nightly-gpu.yaml'
      - 'tests/gpu/**'
      - '.devcontainer/gpu/**'
  schedule:
    - cron: '17 0 * * *'   # every night: the core rows
    - cron: '47 1 * * 0'   # every Sunday: all the rows
  workflow_dispatch:
    inputs:
      matrix:
        description: Which rows to run, see tests/gpu/matrix.py.
        required: false
        default: core
        type: choice
        options:
          - core
          - full
      seed:
        description: Seed of the synthetic models (default is the run id).
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: nightly-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gpu-tests:
    runs-on:
      group: nv-gpu-amd64-t4-2gpu
      labels: linux-amd64-gpu-t4-latest-2
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check runner GPUs
        run: nvidia-smi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js for Dev Containers CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate synthetic models, stream them to two GPUs and compare
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/gpu/devcontainer.json
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          env: |
            GPU_SEED=${{ inputs.seed || github.run_id }}
            GPU_MATRIX=${{ inputs.matrix || ((github.event_name == 'push' || github.event.schedule == '47 1 * * 0') && 'full') || 'core' }}
          runCmd: bash tests/gpu/setup_and_run.sh

      - name: Show where the time went
        if: always()
        run: |
          if [ -f test-results/gpu/timing-summary.txt ]; then
            { echo '### Where the time went'; echo '```'; cat test-results/gpu/timing-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GPU test logs and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-results
          path: test-results/gpu/
          if-no-files-found: warn
          retention-days: 14
