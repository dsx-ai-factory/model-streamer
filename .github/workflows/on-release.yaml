name: RunAI Model Streamer Library - Release

on:
  release:
    types:
      - created

jobs:
  build:
    name: Build wheels and SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set PACKAGE_VERSION
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        version="${RELEASE_TAG#v}"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]] || exit 1
        echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

    - name: Build package
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/${{ github.repository }}/devcontainer
        cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
        push: never
        runCmd: |
          PACKAGE_VERSION=${{ env.PACKAGE_VERSION }} make build

    - name: Upload wheels for publishing
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: py/*/dist/*.whl
        if-no-files-found: error
        compression-level: 0

    - name: Upload SDK for validation
      uses: actions/upload-artifact@v4
      with:
        name: sdk
        path: sdk/dist/*
        if-no-files-found: error
        compression-level: 0

  test-sdk:
    needs: build
    uses: ./.github/workflows/test-sdk.yaml
    permissions:
      contents: read

  publish:
    name: Publish validated release artifacts
    needs: [build, test-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: wheels
        path: py
    - uses: actions/download-artifact@v4
      with:
        name: sdk
        path: sdk/dist
    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name }}
        fail_on_unmatched_files: true
        files: |
          py/*/dist/*.whl
          sdk/dist/*.tar.gz
          sdk/dist/*.tar.gz.sha256

    - name: Publish streamer package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: py/runai_model_streamer/dist/
        print-hash: true

    - name: Publish s3 streamer package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: py/runai_model_streamer_s3/dist/
        print-hash: true

    - name: Publish GCS streamer package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: py/runai_model_streamer_gcs/dist/
        print-hash: true

    - name: Publish Azure streamer package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: py/runai_model_streamer_azure/dist/
        print-hash: true
