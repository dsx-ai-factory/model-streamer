name: RunAI Model Streamer Library - Release

on:
  release:
    types:
      - created

jobs:
  build:
    name: Build wheels and SDK (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    # Both targets use the existing x86_64 devcontainer and cross-toolchain,
    # with independent Bazel output trees on separate runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set PACKAGE_VERSION
      id: version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        version="${RELEASE_TAG#v}"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$ ]] || exit 1
        echo "PACKAGE_VERSION=$version" >> "$GITHUB_OUTPUT"

    - name: Build package
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/${{ github.repository }}/devcontainer
        cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
        push: never
        runCmd: |
          PACKAGE_VERSION=${{ steps.version.outputs.PACKAGE_VERSION }} make build_${{ matrix.arch }}

    - name: Upload wheels for publishing
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.arch }}
        path: py/*/dist/*.whl
        if-no-files-found: error
        compression-level: 0

    - name: Upload SDK for validation
      uses: actions/upload-artifact@v4
      with:
        name: sdk-${{ matrix.arch }}
        path: sdk/dist/*
        if-no-files-found: error
        compression-level: 0

  test-sdk:
    name: Test SDK (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
    - uses: actions/download-artifact@v4
      with:
        name: sdk-${{ matrix.arch }}
        path: sdk/dist
    - name: Test the release archive in a clean consumer container
      env:
        SDK_ARCH: ${{ matrix.arch }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        docker run --rm \
          -v "$PWD:/src:ro" -w /src \
          -e SDK_ARCH -e RELEASE_TAG ubuntu:20.04 bash -euc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              python3 gcc g++ cmake make pkg-config binutils ca-certificates
            make test-sdk SDK_ARCHIVE="sdk/dist/runai-model-streamer-sdk-${RELEASE_TAG#v}-linux-${SDK_ARCH}.tar.gz"
          '

  publish-github:
    name: Publish GitHub release assets
    needs: [build, test-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
        path: py
    - uses: actions/download-artifact@v4
      with:
        pattern: sdk-*
        merge-multiple: true
        path: sdk/dist
    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name }}
        fail_on_unmatched_files: true
        files: |
          py/*/dist/*.whl
          sdk/dist/*.tar.gz
          sdk/dist/*.tar.gz.sha256

  publish-pypi:
    name: Publish ${{ matrix.package }} to PyPI
    needs: [build, test-sdk]
    strategy:
      fail-fast: false
      matrix:
        package:
          - runai_model_streamer
          - runai_model_streamer_s3
          - runai_model_streamer_gcs
          - runai_model_streamer_azure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
        path: py
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: py/${{ matrix.package }}/dist/
        print-hash: true
