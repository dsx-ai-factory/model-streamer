# Bazel downloader rewrites, read through --downloader_config in .bazelrc.
#
# libaio: the Bazel Central Registry's libaio module still names releases.pagure.org, which has
# returned 404 since pagure.io was sunset. Debian's orig tarball is byte-identical to that release,
# and Bazel still checks it against the registry's integrity hash, so a different archive fails the
# fetch instead of being built.
rewrite releases.pagure.org/libaio/libaio-([0-9.]+)\.tar\.gz deb.debian.org/debian/pool/main/liba/libaio/libaio_$1.orig.tar.gz
